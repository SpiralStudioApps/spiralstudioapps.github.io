<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiral Studio</title>
<meta name="description" content="Spiral Studio makes calm, private apps for Android. No ads, no tracking.">
<link rel="icon" type="image/png" href="stillness/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b11;--card:#0f1722;--line:#1c2735;--text:#e6ebf2;--muted:#8e9bad}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:44px;margin-bottom:8px}
p{color:var(--muted);margin-bottom:36px;text-align:center}
a.app{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 22px;color:var(--text);text-decoration:none;max-width:440px;width:100%}
a.app:hover{border-color:#2c3b50}
a.app img{width:56px;height:56px;border-radius:14px}
a.app b{font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:22px;display:block}
a.app span{color:var(--muted);font-size:15px}
footer{margin-top:40px;color:var(--muted);font-size:14px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<h1>Spiral Studio</h1>
<p>Calm, private apps for Android. No ads, no tracking.</p>
<a class="app" href="stillness/"><img src="stillness/img/icon-192.png" alt=""><div><b>Stillness</b><span>Phone lock &amp; app blocker with a calm lock screen</span></div></a>
<footer><a href="mailto:spiralstudio.apps@gmail.com">spiralstudio.apps@gmail.com</a></footer>
</body>
</html>
